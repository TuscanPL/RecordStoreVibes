<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>CrateSampler</title>
    <meta name="description" content="Dig for samples on your phone. Flag the good bits, chop them into pads, take them away as WAVs." />

    <!-- Home screen / standalone -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0e0c0a" />
    <!-- Both spellings: the apple- prefix is what older iOS reads, the
         unprefixed one is the standard newer versions prefer. Without a
         standalone signal iOS keeps the browser chrome at the bottom. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      `black`, not `black-translucent`. Translucent makes content run under
      the status bar but leaves window.innerHeight excluding it, so the page
      ends up exactly one status bar short of the screen — measured on device
      as win 797 against scr 844, with the missing 47px showing as a band
      below the tab bar. Opaque hands back a viewport that matches the space
      it actually occupies, and against a near-black theme the bar is
      seamless anyway.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Crate" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230e0c0a'/><circle cx='16' cy='16' r='9' fill='none' stroke='%23d99a4e' stroke-width='2'/><circle cx='16' cy='16' r='2' fill='%23d99a4e'/></svg>"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
